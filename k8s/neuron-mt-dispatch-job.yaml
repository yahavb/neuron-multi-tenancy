apiVersion: batch/v1
kind: Job
metadata:
  name: neuron-mt-dispatch
  namespace: default
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 14400
  template:
    spec:
      restartPolicy: Never
      nodeSelector:
        node-type: trn2
      resourceClaims:
        - name: neurons
          resourceClaimTemplateName: s-lnc2
      containers:
        - name: dispatch
          image: 421672808698.dkr.ecr.us-east-1.amazonaws.com/concourse-release-0461d3b@sha256:404df227713513e8d01dadc03a8722825c8b9b526561c8d08897a6a5fecc0f06
          imagePullPolicy: Always
          command:
            - /bin/bash
            - "-ec"
            - |
              set -euo pipefail
              cd /tmp
              git clone -q --depth 1 -b "${BRANCH:-main}" \
                "https://yahavb:${GITHUB_TOKEN}@github.com/yahavb/neuron-multi-tenancy.git" REPRO
              cd REPRO

              RUN="dispatch_$(date -u +%Y%m%d_%H%M%S)"
              OUT=/tmp/mt_out; mkdir -p "$OUT"
              RUNDIR="/var/mdl/mt/$RUN"

              git rev-parse HEAD > "$OUT/commit.txt"
              git log -1 --pretty=%s >> "$OUT/commit.txt"
              neuronx-cc --version > "$OUT/cc.txt" 2>&1 || true
              env | grep -E '^(T0_|T1_|EVENT|STEPS|DISPATCH|NEURON)' | sort > "$OUT/flags.txt" || true
              cat "$OUT/commit.txt" "$OUT/cc.txt" "$OUT/flags.txt"

              archive() {
                mkdir -p "$RUNDIR" || true
                tar -czf "/tmp/$RUN.tar.gz" -C /tmp mt_out || true
                cp "/tmp/$RUN.tar.gz" "$RUNDIR/" || true
                if [ -s "$OUT/dispatch_report.json" ]; then cp "$OUT/dispatch_report.json" "$RUNDIR/" || true; fi
                ls -la "$RUNDIR" 2>/dev/null || true
              }
              trap archive EXIT

              MT_STAT="$OUT/dispatch_stat" \
                torchrun --standalone --nproc-per-node 4 \
                  dispatch_serve.py 2>&1 | tee "$OUT/dispatch.log"

              python3 -u dispatch_report.py "$OUT/dispatch_stat.rank*.json" \
                "$OUT/dispatch_report.json" 2>&1 | tee "$OUT/report.log"
          resources:
            claims:
              - name: neurons
            requests: { cpu: 12, memory: 96Gi, ephemeral-storage: 20Gi }
            limits:   { cpu: 150, memory: 1800Gi, ephemeral-storage: 180Gi }
          volumeMounts:
            - { name: dshm, mountPath: /dev/shm }
            - { name: 621547421844-ap-southeast-4-pvc, mountPath: /var/mdl }
          env:
            - { name: PYTHONUNBUFFERED,         value: "1" }
            - { name: BRANCH,                   value: "main" }
            - { name: T0_DIM,                   value: "2048" }
            - { name: T1_DIM,                   value: "1536" }
            - { name: EVENTS,                   value: "200" }
            - { name: EVENT_PATTERN,            value: "alternate" }
            - { name: EVENT_BURST,              value: "8" }
            - { name: STEPS_PER_EVENT,          value: "10" }
            - { name: DISPATCH_POLICY,          value: "eager" }
            - { name: EVENT_SOURCE,             value: "self" }
            - { name: NEURON_LOGICAL_NC_CONFIG, value: "2" }
            - { name: NEURON_CC_FLAGS,          value: "--target trn2 --lnc 2" }
            - { name: NEURON_RT_LOG_LEVEL,      value: "ERROR" }
            - name: GITHUB_TOKEN
              valueFrom: { secretKeyRef: { name: github-token, key: GITHUB_TOKEN } }
      volumes:
        - name: dshm
          emptyDir: { medium: Memory, sizeLimit: 32Gi }
        - name: 621547421844-ap-southeast-4-pvc
          persistentVolumeClaim: { claimName: 621547421844-ap-southeast-4-pvc }
