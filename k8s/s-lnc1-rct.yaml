apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: s-lnc1
spec:
  spec:
    devices:
      constraints:
      - matchAttribute: resource.aws.com/devicegroup1_id
        requests:
        - neurons
      requests:
      - name: neurons
        exactly:
          allocationMode: ExactCount
          count: 1
          deviceClassName: neuron.aws.com
          selectors:
          - cel:
              expression: device.attributes['neuron.aws.com'].instanceType in ['trn2.48xlarge', 'trn3-dev1.48xlarge']
      config:
      - requests: ["neurons"]
        opaque:
          driver: neuron.aws.com
          parameters:
            apiVersion: neuron.aws.com/v1
            kind: NeuronConfig
            logicalNeuronCore: 1
